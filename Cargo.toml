[workspace]
members = ["compiler", "conformance-tests", "runtime", "rinklecate"]
resolver = "2"

[workspace.package]
version = "2.0.0"
authors = ["Rafael Garcia <bladecoder@gmail.com>"]
repository = "https://github.com/bladecoder/blade-ink-rs/"
license = "Apache-2.0"
edition = "2024"

[workspace.dependencies]
serde_json = "1.0.151"
rand = { version = "0.10.2", default-features = false }
bladeink = { path = "runtime", version = "2.0.0" }
bladeink-compiler = { path = "compiler", version = "2.0.0" }
